<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio</title>
<style>
  /* PPFrama-Black está instalada en el Mac; en la TV cae a la alternativa */
  @font-face{font-family:'FramaBlack';src:local('PPFrama-Black'),local('PPFrama Black'),local('PPFramaBlack');}
  @font-face{font-family:'GroteskMed';src:local('NHaasGroteskDSPro-65Md'),local('Neue Haas Grotesk Display Pro 65 Medium'),local('HelveticaNeue-Medium');}

  :root{
    --paper:#FFFFFF;
    --ghost:#EDEDED;
    --ink:#1A1A1A;
    --red:#E0321F;
    --green:#23402F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'GroteskMed','Helvetica Neue',Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  .stage{position:fixed;inset:0;overflow:hidden;background:var(--paper)}

  /* ---------- campo tipográfico ---------- */
  .rail{position:absolute;inset:0}
  .word{
    position:absolute;
    font-family:'FramaBlack','Archivo Black','Helvetica Neue',Arial,sans-serif;
    font-weight:900;
    color:var(--ghost);
    white-space:nowrap;
    line-height:1;
    letter-spacing:-.02em;
    transform-origin:left top;
    z-index:1;
  }

  /* ---------- imagen del activo ---------- */
  #frame{
    z-index:3;
    position:absolute;left:813px;top:353.178px;width:294px;height:373.644px;
    overflow:hidden;background:#EDEDED;
  }
  #frame img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
  #frame .ph{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'FramaBlack','Archivo Black',Arial,sans-serif;font-size:150px;color:#FFFFFF;
  }

  /* ---------- microtipografía ---------- */
  .u{position:absolute;z-index:5;font-size:15px;line-height:14px;letter-spacing:.005em;color:var(--ink)}
  .u.dim{color:#8A8A8A}
  #appName{left:1119px;top:355.267px}
  #desc{left:1272px;top:523px;width:447px}
  #index{left:201px;top:532px}
  #home{left:48px;top:47px}
  #topA{left:1578px;top:47px}
  #topB{left:1731px;top:47px}
  #botA{left:48px;top:1018px}
  #botB{left:201px;top:1018px}
  #botC{left:890px;top:1018px}
  #botD{left:1731px;top:1018px}
  .sq{position:absolute;z-index:5;width:12px;height:12px;background:var(--red)}
  #sqL{left:48px;top:534px}
  #sqR{left:1860px;top:534px}
  #svc{display:inline-block;width:7px;height:7px;border-radius:50%;background:#C9C9C9;margin-right:6px;vertical-align:1px}
  #svc.ok{background:var(--green)}
  #svc.bad{background:var(--red)}

  #err{position:fixed;left:0;right:0;bottom:0;background:var(--red);color:#fff;
       font:12px/1.4 Menlo,monospace;padding:6px 10px;display:none;z-index:99;white-space:pre-wrap}
</style>
</head>
<body>
<div class="stage">
  <div class="rail" id="rail"></div>
  <div id="frame"><img id="pic" alt="" style="display:none"><div class="ph" id="ph"></div></div>

  <div class="u" id="appName">—</div>
  <div class="u" id="desc"></div>
  <div class="u dim" id="index">(001)</div>
  <div class="u" id="home">inicio</div>
  <div class="u dim" id="topA">TIZEN</div>
  <div class="u dim" id="topB"></div>
  <div class="u dim" id="botA">INICIO</div>
  <div class="u dim" id="botB">08 APPS</div>
  <div class="u dim" id="botC"><span id="svc"></span><span id="svcTxt">servicio</span></div>
  <div class="u dim" id="botD"></div>

  <div class="sq" id="sqL"></div>
  <div class="sq" id="sqR"></div>
</div>
<div id="err"></div>
<script>
window.onerror=function(m,s,l,c){var d=document.getElementById('err');
d.style.display='block';d.textContent='ERROR: '+m+'  @'+l+':'+c;return false;};

var SERVICE="http://127.0.0.1:8090";

var APPS=[
  {label:"Netflix", img:"assets/netflix.jpg",    ph:"#1A1A1A", x:648.56, match:/netflix/i,         desc:"Series y películas. El catálogo completo."},
  {label:"Disney+", img:"assets/disney.jpg",    ph:"#2B45C4", x:586.40, match:/disney/i,          desc:"Disney, Pixar, Marvel, Star Wars y National Geographic."},
  {label:"Prime Video", img:"assets/prime.jpg",ph:"#2B45C4", x:397.79, match:/prime|amazon/i,    desc:"El catálogo de Amazon, con deporte en directo."},
  {label:"Spotify",    x:277.17, match:/spotify/i, img:"assets/spotify.jpg", desc:"Música, pódcast y listas. Reproduce desde el móvil o desde el mando."},
  {label:"Mediaset", img:"assets/mediaset.jpg",   ph:"#E0321F", x:511.84, match:/mediaset|mitele/i, desc:"Los canales y el catálogo de Mediaset España."},
  {label:"Plex", img:"assets/plex.jpg",       ph:"#23402F", x:752.52, match:/plex/i,            desc:"Tu servidor multimedia, ordenado en casa."},
  {label:"YouTube", img:"assets/youtube.jpg",    ph:"#E0321F", x:544.03, match:/youtube/i,         desc:"Vídeo, música y directos."},
  {label:"Apple TV", img:"assets/appletv.jpg",   ph:"#1A1A1A", x:620.00, match:/apple/i,           desc:"Apple TV+ y el catálogo de Apple."}
];

var SIZES={base:185, active:370};
var BASE_ACTIVE=660.25;
var GAP=198, GAP_BEFORE=353.43, GAP_AFTER=255.96;
var MAXW=1600;

var rail=document.getElementById("rail");
var nodes=[];
var active=parseInt((new URLSearchParams(location.search).get("i")||"0"),10)||0;

APPS.forEach(function(app,i){
  var d=document.createElement("div");
  d.className="word";
  d.textContent=app.label;
  d.style.left=app.x+"px";
  d.addEventListener("click",function(){ active=i; render(); });
  rail.appendChild(d);
  nodes.push(d);
});

var cv=document.createElement("canvas"), ctx=cv.getContext("2d");
function widthAt(text,size){
  ctx.font=size+'px "FramaBlack", "Archivo Black", "Helvetica Neue", Arial';
  return ctx.measureText(text).width;
}
function sizeFor(app){
  var w=widthAt(app.label,SIZES.active);
  if(w<=MAXW) return SIZES.active;
  return Math.floor(SIZES.active*MAXW/w);
}

function pad(n){ return n<10?"0"+n:""+n; }

function yFor(rel){
  if(rel===0) return BASE_ACTIVE;
  var y;
  if(rel<0){ y=BASE_ACTIVE-GAP_BEFORE; for(var k=-2;k>=rel;k--) y-=GAP; return y; }
  y=BASE_ACTIVE+GAP_AFTER; for(var k=2;k<=rel;k++) y+=GAP; return y;
}

function render(){
  var N=APPS.length;
  for(var rel=-4; rel<=3; rel++){
    var i=(active+rel+N*2)%N;
    var app=APPS[i], n=nodes[i], isActive=(rel===0);
    var size=isActive?sizeFor(app):SIZES.base;
    var y=yFor(rel);
    n.style.fontSize=size+"px";
    n.style.top=(y-size*0.76)+"px";
    n.style.left=(isActive?277:app.x)+"px";
    n.style.zIndex=isActive?1:0;
  }

  var a=APPS[active];
  var ph=document.getElementById("ph"), pic=document.getElementById("pic");
  ph.textContent=a.label.charAt(0);
  ph.style.background=a.ph||"#1A1A1A";
  if(a.img){ pic.onerror=function(){ this.style.display="none"; ph.style.display="flex"; }; pic.src=a.img; pic.style.display="block"; ph.style.display="none"; }
  else { pic.style.display="none"; ph.style.display="flex"; }

  document.getElementById("appName").textContent=a.label;
  document.getElementById("desc").textContent=a.desc;
  document.getElementById("index").textContent="("+(active<9?"00":active<99?"0":"")+(active+1)+")";
  document.getElementById("botB").textContent=(APPS.length<10?"0":"")+APPS.length+" APPS";
}

/* ---------- servicio del módulo ---------- */
function dbg(t){ var e=document.getElementById("svcTxt"); if(e) e.textContent=t; }

var tries=0;
function boot(){
  if(new URLSearchParams(location.search).get("preview")) return;
  tries++;
  fetch(SERVICE+"/status",{cache:"no-store"})
    .then(function(r){return r.json();})
    .then(function(st){ window.__status=st; return fetch(SERVICE+"/apps",{cache:"no-store"}); })
    .then(function(r){ return r.json(); })
    .then(function(list){
      if(!Array.isArray(list)) throw new Error("lista inválida");
      var found=0;
      APPS.forEach(function(app){
        var hit=list.filter(function(x){return app.match.test(x.name||"")&&x.id;})[0];
        if(hit){ app.id=hit.id; found++; }
      });
      document.getElementById("svc").className="ok";
      dbg("SERVICIO OK · "+found+"/"+APPS.length+" APPS");
      if(window.__status){
        var pl=window.__status.platform;
        if(pl) document.getElementById("topA").textContent="TIZEN "+pl;
      }
    })
    .catch(function(e){
      if(tries<20){ setTimeout(boot,1200); return; }
      document.getElementById("svc").className="bad";
      dbg("SIN SERVICIO · "+(e&&e.message?e.message:e));
    });
}

function launch(){
  var a=APPS[active];
  if(!a.id){ dbg(a.label+" · no instalada"); return; }
  fetch(SERVICE+"/launch?id="+encodeURIComponent(a.id))
    .then(function(r){return r.json();})
    .then(function(j){ if(!j.ok) dbg(a.label+" · no abrió"); })
    .catch(function(){ dbg("servicio caído"); });
}

function onKey(e){
  var k=e.keyCode;
  if(k===38||k===37){ active=(active-1+APPS.length)%APPS.length; render(); }
  else if(k===40||k===39){ active=(active+1)%APPS.length; render(); }
  else if(k===13||k===10252){ launch(); }
  else return;
  e.preventDefault();
}
document.addEventListener("keydown",onKey,true);
window.addEventListener("keydown",onKey,false);

function tick(){
  var d=new Date(), t=pad(d.getHours())+":"+pad(d.getMinutes());
  document.getElementById("topB").textContent=t;
  document.getElementById("botD").textContent=pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+String(d.getFullYear()).slice(2);
}
tick(); setInterval(tick,20000);

render();
boot();
</script>
</body>
</html>
