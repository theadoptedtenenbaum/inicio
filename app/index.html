  :root{
    --m:48px;          /* margen */
    --c:141px;         /* columna */
    --g:12px;          /* calle */
    --col6:calc(var(--m) + 5 * (var(--c) + var(--g)));
    --col8:calc(var(--m) + 7 * (var(--c) + var(--g)));
    --col9:calc(var(--m) + 8 * (var(--c) + var(--g)));
    --col10:calc(var(--m) + 10 * (var(--c) + var(--g)));
    --col11:calc(var(--m) + 11 * (var(--c) + var(--g)));
    --col1:calc(var(--m) + 1 * (var(--c) + var(--g)));
    --paper:#FFFFFF;
    --ghost:#EDEDED;
    --ink:#1A1A1A;
    --red:#E0321F;
    --green:#23402F;
  }

    color:var(--ink);

}

function render(){
  var N=APPS.length, g=baselines();

  for(var rel=-4; rel<=3; rel++){
    var i=(active+rel+N*2)%N, n=nodes[i], isActive=(rel===0);
    var s=g.S[i]/SMAX;
    var dx=isActive?277:APPS[i].x;
    var dy=g.B[i]-BASE_ACTIVE;
    var wrap=Math.abs(rel-lastRel[i])>1;
    if(wrap) n.style.transition="none";
    n.style.transform="translate3d("+dx+"px,"+dy+"px,0) scale("+s+")";
    var dist=Math.abs(rel);
    var b=isActive?0:(dist===1?2.4:dist===2?4.8:8)/s;
    n.style.filter=isActive?"none":("blur("+b+"px)");
    n.style.opacity=isActive?1:(dist===1?0.9:0.72);
    if(wrap){ void n.offsetWidth; n.style.transition=""; }
    lastRel[i]=rel;
  }

  var a=APPS[active], f=document.getElementById("frame"), lg=document.getElementById("logo");
  f.style.background=a.bg||"#1A1A1A";
  lg.innerHTML=(a.icon||"")||('<div class="mark" style="color:#fff;font-family:FramaBlack;font-size:64px;text-align:center">'+a.label.charAt(0)+'</div>');
  if(active!==lastActive){
    f.classList.remove("aparecer"); void f.offsetWidth; f.classList.add("aparecer");
  }
  lastActive=active;

  document.getElementById("appName").textContent=a.label;
  var L=LISTS[a.label];
  var falta=(a.ids&&!a.id);
  document.getElementById("desc").innerHTML=L.label+"<br>"+L.items+(falta?"<br>NO INSTALADA EN ESTA TV":"");
  document.getElementById("index").textContent="("+(active<9?"00":active<99?"0":"")+(active+1)+")";
  document.getElementById("botB").textContent="OTRAS APPS";
}

/* ---------- servicio del módulo ---------- */
function dbg(t){}

var tries=0;
function boot(){
  if(new URLSearchParams(location.search).get("preview")){ document.documentElement.className+=" static"; return; }
  tries++;
  var ld=document.getElementById("desc");
  if(ld && tries>1){ ld.innerHTML=LOADING[(tries-2)%LOADING.length]; }
  fetch(SERVICE+"/status",{cache:"no-store"})
    .then(function(r){return r.json();})
    .then(function(st){ window.__status=st; return fetch(SERVICE+"/apps",{cache:"no-store"}); })
    .then(function(r){ return r.json(); })
    .then(function(list){
      if(!Array.isArray(list)) throw new Error("lista inválida");
      var found=0;
      APPS.forEach(function(app){
        var hit=list.filter(function(x){return ((app.match.test(x.name||""))||((app.ids||[]).indexOf(x.id)>=0))&&x.id;})[0];
        if(hit){ app.id=hit.id; found++; }
      });
      if(new URLSearchParams(location.search).get("debug")){
        document.getElementById("desc").innerHTML="APPS DE LA TV<br>"+list.map(function(x){return (x.name||"·");}).join(" · ");
      }
      document.getElementById("svc").className="ok";
      dbg("SERVICIO OK · "+found+"/"+APPS.length+" APPS");
      if(window.__status){
        var pl=window.__status.platform;
        if(pl) document.getElementById("topA").textContent="TIZEN "+pl;
      }
    })
    .catch(function(e){
      if(tries<20){ setTimeout(boot,1200); return; }
      document.getElementById("svc").className="bad";
      dbg("SIN SERVICIO · "+(e&&e.message?e.message:e));
    });
}

function launch(){
  var a=APPS[active];
  if(!a.id){ dbg(a.label+" · no instalada"); return; }
  fetch(SERVICE+"/launch?id="+encodeURIComponent(a.id))
    .then(function(r){return r.json();})
    .then(function(j){ if(!j.ok) dbg(a.label+" · no abrió"); })
    .catch(function(){ dbg("servicio caído"); });
}

function onKey(e){
  var k=e.keyCode;
  if(k===38||k===37){ active=(active-1+APPS.length)%APPS.length; render(); }
  else if(k===40||k===39){ active=(active+1)%APPS.length; render(); }
  else if(k===13||k===10252){ launch(); }
  else return;
  e.preventDefault();
}
document.addEventListener("keydown",onKey,true);
window.addEventListener("keydown",onKey,false);

function tick(){
  var d=new Date(), t=pad(d.getHours())+":"+pad(d.getMinutes());
  document.getElementById("topB").textContent=t;
  document.getElementById("botD").textContent=pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+String(d.getFullYear()).slice(2);
}
tick(); setInterval(tick,20000);

render();
boot();
</script>
</body>
</html>
